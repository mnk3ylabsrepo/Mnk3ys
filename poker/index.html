<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Poker · MNK3YLABS</title>
  <meta name="description" content="MNK3YLABS poker tournaments on BUX Poker — registering, running, and completed events." />
  <link rel="icon" href="/assets/preview2/gorilla-logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Nunito:wght@800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/poker.css?v=1" />
</head>
<body class="pk">
  <header class="pk-top">
    <a class="pk-brand" href="/">
      <img src="/assets/preview2/gorilla-logo.png" alt="" width="40" height="40" />
      <span>MNK3Y<span class="g">LABS</span></span>
    </a>
    <a class="pk-home" href="/">Home</a>
  </header>

  <main class="pk-main">
    <p class="pk-kicker">BUX Poker · beta</p>
    <h1 class="pk-title">P<span class="g">OK</span>ER</h1>
    <p class="pk-lede">
      Tournaments with MNK3YS registration enabled. SLOTTO cross-community freeroll runs Wednesdays at 9pm EST —
      prizes in that week’s project token.
    </p>

    <div class="pk-tabs" role="tablist" aria-label="Tournament status">
      <button type="button" class="pk-tab is-active" role="tab" aria-selected="true" data-tab="registering">Registering</button>
      <button type="button" class="pk-tab" role="tab" aria-selected="false" data-tab="running">Running</button>
      <button type="button" class="pk-tab" role="tab" aria-selected="false" data-tab="completed">Completed</button>
    </div>

    <p class="pk-status" id="pk-status" role="status">Loading tournaments…</p>
    <div class="pk-list" id="pk-list" hidden></div>
  </main>

  <script src="/js/poker.js?v=1"></script>
</body>
</html>
